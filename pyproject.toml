[project]
name = "feedback-prd-generator"
version = "0.1.0"
description = "User feedback analysis and PRD draft generation demo for AI product management portfolios."
requires-python = ">=3.11"
dependencies = [
  "pandas>=3.0.0",
  "openpyxl>=3.1.0",
  "xlsxwriter>=3.2.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
streamlit = ["streamlit>=1.59.0", "plotly>=6.0.0"]
fetch = ["google-play-scraper>=1.2.7"]
test = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
